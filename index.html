<style>
:root{

  --accent:#20706C; --accent-ink:#FFFFFF; --accent-soft:#E3EEEC; --ok:#2E7D4F; --bad:#B3261E;
  --duo:#B7C0BE; --new:#F2C200; --new-ink:#2B2300; --new-soft:#FFF5C7;

}

:root[data-theme="dark"]{
  --paper:#151A1B; --card:#1E2526; --ink:#E6EBEA; --dim:#9AA7A5; --line:#2E3839; --line2:#3C4849; --soft:#232B2C;
  --accent:#5DBBB4; --accent-ink:#0F1F1E; --accent-soft:#1F3331; --ok:#5FBF87; --bad:#F08A80;
  --duo:#4A5657; --new:#F5D04A; --new-ink:#211B02; --new-soft:#3A3212;

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.mono,td.num,th.num{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;line-height:1.25}
.wrap{max-width:72rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--card);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:1.3rem .9rem}
header.top h1{margin:0;font-size:1.45rem}
nav.tabs{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;flex-wrap:wrap;gap:.3rem;padding-block:.5rem}
nav.tabs button{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:.35rem 1rem;cursor:pointer;font-weight:600}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main{padding-block:1.2rem 4rem}
h2{font-size:1.1rem;margin:1.4rem 0 .5rem}
p{margin:.45rem 0}
.dim{color:var(--dim)}.small{font-size:.84rem}
.lead{font-size:1.05rem;font-weight:600;margin:.2rem 0 .8rem}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.5rem 0;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:.4rem .55rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;background:var(--soft);font-size:.8rem}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
table th.num{white-space:normal;font-family:inherit;vertical-align:bottom}
.hs{display:block;font-weight:600;font-size:.72rem;color:inherit}
.sm{display:none}
th.ctr,td.ctr{text-align:center}
tr.total td{font-weight:700;border-top:2px solid var(--line2)}
tr.pct td{font-weight:700}
th.qa{color:var(--qa)}th.qb{color:var(--qb)}
td.hi{font-weight:700}
td.ins{white-space:nowrap}td.ins .b{color:var(--dim)}
.cell{display:flex;gap:.3rem;flex-wrap:nowrap}

/* compact players (examples table) */
.mini{--p:0%;display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--line2);border-radius:999px;padding:.4rem .8rem .4rem .4rem;min-height:2.75rem;cursor:pointer;white-space:nowrap;font-size:1rem;font-weight:600;
  background:linear-gradient(90deg,var(--accent-soft) var(--p),var(--card) var(--p))}
.mini .ico{display:inline-flex;align-items:center;justify-content:center;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.8rem;flex:none}
.mini.playing{border-color:var(--accent)}.mini.playing .ico{background:var(--ink);color:var(--paper)}
.mini.qa{border-color:color-mix(in srgb,var(--qa) 55%,var(--line2))}.mini.qb{border-color:color-mix(in srgb,var(--qb) 55%,var(--line2))}

/* examples: one table at every width; on narrow screens it scrolls sideways inside its box, the number column pinned */
.exwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.exs{min-width:65rem}
.xr .c-duo .btns{flex-wrap:nowrap}
.xr{display:grid;grid-template-columns:2.2rem minmax(6.5rem,1fr) minmax(16.6rem,1.2fr) 5.4rem 5.4rem minmax(11.6rem,1fr) minmax(12.4rem,1fr);gap:.5rem .55rem;align-items:center;padding:.6rem .8rem;border-bottom:1px solid var(--line);background:var(--card)}
.xr .c-num{position:sticky;left:0;z-index:1;background:inherit;align-self:stretch;display:flex;align-items:center;margin-left:-.8rem;padding-left:.8rem}
.xr:last-child{border-bottom:0}
.xr.h{background:var(--soft);font-size:.8rem;font-weight:600;align-items:end;padding-block:.5rem}
.xr .c-num{font-weight:700;font-size:1.05rem}
.xr .c-ins{font-size:.92rem}.xr .c-ins .b{color:var(--dim)}
.xr .ctr{text-align:center;margin-bottom:.2rem}
.btns{display:flex;flex-wrap:wrap;gap:.45rem}
.pm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:.84rem}
.xr.h .pm{font-family:inherit}
.pm .hi{font-weight:700}.pm .d,.pm .dh{font-weight:700;color:var(--delta)}
.pm>span{padding-inline:.45rem}.pm>span:first-child{padding-left:0}.pm>span+span{border-left:1px solid var(--line2)}
.xr .c-partner{border-left:2px solid var(--line2);padding-left:.8rem}
.pm.ph,.mlab,.badge{display:none}
@media (max-width:32rem){
  table th,table td{padding:.4rem .4rem}
  .lg{display:none}.sm{display:inline}
}

/* try it */
.picker{display:flex;flex-wrap:wrap;gap:.35rem;margin:.2rem 0 .8rem}
.picker button{min-width:2.4rem;padding:.3rem .6rem;border:1px solid var(--line2);border-radius:999px;background:var(--card);cursor:pointer}
.picker button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.picker button.okm::after{content:" ✓";font-size:.85em}.picker button.badm::after{content:" ✗";font-size:.85em}
.exhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .8rem;margin:.2rem 0}
.exhead h3{margin:0;font-size:1.15rem}
.sub{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:1rem 0 .35rem}
.qbanner{border-radius:10px;padding:.5rem .85rem;border:2px solid;display:flex;flex-direction:column}
.qbanner b{font-size:1rem}
.q-contA.qbanner{background:var(--qa-soft);border-color:var(--qa)}.q-contA.qbanner b{color:var(--qa)}
.q-reactB.qbanner{background:var(--qb-soft);border-color:var(--qb)}.q-reactB.qbanner b{color:var(--qb)}
.qchoose{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.qchoose button{text-align:left;cursor:pointer;opacity:.5}
.qchoose button.sel{opacity:1;box-shadow:0 0 0 3px var(--card),0 0 0 5px currentColor}
.qchoose button.q-contA{color:var(--qa)}.qchoose button.q-reactB{color:var(--qb)}
.ctx{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.pl{position:relative;display:flex;flex-direction:column;gap:.35rem;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem;text-align:left;cursor:pointer;width:100%}
.pl:hover{border-color:var(--line2)}.pl.playing{border-color:var(--accent)}
.pl .lab{display:flex;align-items:center;gap:.55rem;font-weight:500;width:100%}
.pl .who{color:var(--dim);font-weight:400;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pl.qfocus{border-width:2px}.pl.qfocus.q-contA{border-color:var(--qa)}.pl.qfocus.q-reactB{border-color:var(--qb)}
.pl .ico{display:inline-flex;align-items:center;justify-content:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);flex:none;font-size:.78rem}
.pl.playing .ico{background:var(--ink);color:var(--paper)}
.barrow{display:flex;align-items:center;gap:.55rem;width:100%}.barrow .bar{flex:1;min-width:0}
.bar{position:relative;height:10px;background:var(--line);border-radius:5px;overflow:hidden;display:flex}
.bar .seg{height:100%;position:relative;overflow:hidden}
.bar .seg.duo{background:color-mix(in srgb,var(--duo) 45%,transparent)}.bar .seg.new{background:color-mix(in srgb,var(--new) 30%,transparent)}
.bar .seg.ctxonly{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.bar .seg+.seg{border-left:2px solid var(--card)}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:0}
.seg.duo .fill{background:var(--duo)}.seg.new .fill{background:var(--new)}.seg.ctxonly .fill{background:var(--accent)}
.time{font-size:.74rem;color:var(--dim);white-space:nowrap}
.pl.innew{border-color:var(--new)}
.tracks{display:grid;gap:.55rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:.5rem .7rem;display:grid;grid-template-columns:5.2rem 1fr;align-items:center;gap:.7rem}
.card.innew{border-color:var(--new);background:var(--new-soft)}
.card .head{display:flex;align-items:center;gap:.4rem;font-weight:600}
.card .reveal-tag{grid-column:1/-1;font-size:.88rem;font-weight:600}
.pair{display:grid;grid-template-columns:1fr 2fr;gap:.55rem}
.choice{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.choice button{padding:.5rem 1.2rem;border-radius:8px;border:2px solid var(--line2);background:var(--card);font-weight:600;cursor:pointer}
.choice button.sel{border-color:var(--accent);background:var(--accent-soft)}
.btn{border:0;border-radius:8px;padding:.55rem 1.1rem;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.revealed{border:2px solid var(--accent);border-radius:10px;background:var(--card);padding:.7rem 1rem;margin-top:.8rem}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.kv{display:grid;grid-template-columns:7rem 1fr;gap:.25rem .8rem;margin:.4rem 0}
.kv dt{color:var(--dim);font-size:.88rem}.kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.3rem 0}
.chip{font-size:.8rem;border-radius:999px;padding:.1rem .55rem;border:1px solid var(--line2);white-space:nowrap}
.chip.q-contA{border-color:var(--qa)}.chip.q-reactB{border-color:var(--qb)}

  .ctx,.pair,.card,.qchoose,.kv{grid-template-columns:1fr}
  header.top h1{font-size:1.25rem}
}

    <dl class="kv"><dt>Duo</dt><dd>${esc(e.past)}</dd><dt style="color:var(--qa)">${XA}</dt><dd>${esc(e.xa)}</dd><dt style="color:var(--qb)">${XB}</dt><dd>${esc(e.xb)}</dd></dl>
    ${pm}
    <div class="chips">${L.rows.map(r => `<span class="chip q-${r.q}">${r.L} · ${Q[r.q].short} → ${r.chose === "XA" ? XA : XB} <span class="${r.chose === Q[r.q].target ? "ok" : "bad"}">${r.chose === Q[r.q].target ? "✓" : "✗"}</span></span>`).join("")}</div></div>`;
}

// ---------- results ("Results": the participants in the posted response; "Updating Results": everyone counted so far)
function resultTables(ids, Ls, T, exTally) {
  const cells = r => `<td class="num">${frac(r.self_k, r.n_A)}</td><td class="num">${frac(r.partner_k, r.n_B)}</td><td class="num">${frac(r.m_k, r.m_n)}</td>`;
  const head = (first, time) => `<thead><tr><th>${first}</th><th class="num qa">agreed with PMus-Self<span class="hs">“continue A” answers</span></th><th class="num qb">agreed with PMus-Partner<span class="hs">“listen to B” answers</span></th><th class="num">overall</th>${time ? '<th class="num">mean time per example</th>' : ""}</tr></thead>`;
  document.getElementById(ids[0]).innerHTML = head('<span class="lg">Participant</span><span class="sm">#</span>', true) + `<tbody>${Ls.map(l => `<tr><td>${l.L}</td>${cells(l)}<td class="num">${Math.round(l.secs)} s</td></tr>`).join("")}
    <tr class="total"><td>All</td>${cells(T)}<td class="num">${Math.round(T.secs)} s</td></tr>
    <tr class="pct"><td>%</td><td class="num">${pc(T.self_k, T.n_A)}</td><td class="num">${pc(T.partner_k, T.n_B)}</td><td class="num">${pc(T.m_k, T.m_n)}</td><td></td></tr></tbody>`;
  const byAgreement = [...EX].sort((a, b) => exTally(b).m_k / exTally(b).m_n - exTally(a).m_k / exTally(a).m_n || a.ex - b.ex);
  document.getElementById(ids[1]).innerHTML = head("Example", false) + `<tbody>${byAgreement.map(e => `<tr><td>${e.ex}</td>${cells(exTally(e))}</tr>`).join("")}</tbody>`;
}
function results() {
  resultTables(["t-listeners", "t-examples"], DATA.listeners, DATA.totals, e => e.listeners);
  const U = DATA.updated;
  document.getElementById("u-date").textContent = `Updated at ${U.date}`;
  resultTables(["u-listeners", "u-examples"], U.listeners, U.totals, e => U.examples[String(e.ex)]);
}

// ---------- tabs (hash: #examples, #try, #results, #updates; #try-ex03 opens an example)
function setTab(name) {
  ["examples", "try", "results", "updates"].forEach(t => { document.getElementById("tab-" + t).hidden = t !== name; });
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === name));
  stopAll();          // section ids are "tab-<name>", so an address ending in #examples or #updates opens the tab without jumping past the headline
}
function route() {
  const h = location.hash.slice(1);
  if (h.startsWith("try")) { setTab("try"); const e = EX.find(x => "try-" + x.stem === h); showEx(e || cur || EX[0]); }
  else setTab(h === "results" || h === "updates" ? h : "examples");
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { try { history.replaceState(null, "", "#" + b.dataset.tab); } catch (err) {} route(); });
window.addEventListener("hashchange", route);
document.addEventListener("keydown", ev => {
  if (document.getElementById("tab-try").hidden || !cur) return;
  if (ev.key === " " && players.some(p => !p.audio.paused)) { ev.preventDefault(); stopAll(); }
});
examplesTable(); results(); route();
</script>
</body></html>
